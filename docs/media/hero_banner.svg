<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 240" width="100%" role="img" aria-label="Sarah Android Voice and Screen Action Assistant">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1C1A"/>
      <stop offset="55%" stop-color="#292420"/>
      <stop offset="100%" stop-color="#3A2720"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E07A5F"/>
      <stop offset="50%" stop-color="#F2CC8F"/>
      <stop offset="100%" stop-color="#81B29A"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="240" rx="22" fill="url(#bgGrad)"/>
  <circle cx="965" cy="120" r="82" fill="#E07A5F" opacity="0.14">
    <animate attributeName="r" values="76;92;76" dur="3.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="965" cy="120" r="56" fill="#E07A5F" opacity="0.22">
    <animate attributeName="r" values="52;62;52" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Animated voice wavebars inside orb -->
  <g transform="translate(935, 92)" fill="#F7F4EF">
    <rect x="0" y="20" width="7" height="16" rx="3.5">
      <animate attributeName="height" values="14;34;14" dur="1.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="21;11;21" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="13" y="10" width="7" height="36" rx="3.5">
      <animate attributeName="height" values="22;48;22" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="y" values="17;4;17" dur="0.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="26" y="6" width="7" height="44" rx="3.5" fill="#F2CC8F">
      <animate attributeName="height" values="30;54;30" dur="1.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="13;1;13" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="39" y="14" width="7" height="28" rx="3.5">
      <animate attributeName="height" values="18;42;18" dur="0.95s" repeatCount="indefinite"/>
      <animate attributeName="y" values="19;7;19" dur="0.95s" repeatCount="indefinite"/>
    </rect>
    <rect x="52" y="20" width="7" height="16" rx="3.5">
      <animate attributeName="height" values="12;30;12" dur="1.15s" repeatCount="indefinite"/>
      <animate attributeName="y" values="22;13;22" dur="1.15s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="48" y="42" width="214" height="28" rx="14" fill="#E07A5F" opacity="0.22"/>
  <text x="64" y="61" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F4A28C" letter-spacing="1.2">OFFLINE WAKE WORD · ANDROID</text>

  <text x="48" y="122" font-family="Georgia, 'Times New Roman', serif" font-size="48" font-weight="700" fill="#F7F4EF">Sarah Voice Agent</text>
  <text x="48" y="158" font-family="Segoe UI, system-ui, sans-serif" font-size="19" fill="#D5CEC5">16-bit BC-ResNet-8 Wake Word · Live Streaming STT/TTS · Accessibility &amp; Shizuku Control</text>

  <rect x="48" y="182" width="520" height="4" rx="2" fill="url(#accentGrad)">
    <animate attributeName="width" values="420;560;420" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
